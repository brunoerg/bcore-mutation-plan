[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutation-planner"
version = "0.1.0"
description = "LLM-assisted mutation testing planner for Bitcoin Core pull requests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mutation-planner = "mutation_planner.cli:main"

[tool.setuptools]
packages = ["mutation_planner", "mutation_planner.llm"]

[tool.setuptools.package-data]
mutation_planner = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
